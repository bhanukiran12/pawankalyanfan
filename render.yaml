# Render Blueprint — ONE web service (full stack in one Docker container)
# https://render.com/docs/blueprint-spec

databases:
  - name: pawankalyanfan-db
    databaseName: pawankalyanfan
    user: pawankalyanfan
    plan: free

services:
  - type: web
    name: pawankalyanfan
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    releaseCommand: npx prisma db push --schema=packages/database/prisma/schema.prisma --accept-data-loss && npm run db:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pawankalyanfan-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: pawankalyanfan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_SERVICE_URL
        value: http://127.0.0.1:4001
      - key: CONTENT_SERVICE_URL
        value: http://127.0.0.1:4002
      - key: COMMUNITY_SERVICE_URL
        value: http://127.0.0.1:4003
      - key: BILLING_SERVICE_URL
        value: http://127.0.0.1:4004
      - key: AI_SERVICE_URL
        value: http://127.0.0.1:4005
      - key: CHARITY_SERVICE_URL
        value: http://127.0.0.1:4006
      - key: API_GATEWAY_URL
        value: http://127.0.0.1:4000
      - key: API_GATEWAY_HOST
        value: 127.0.0.1:4000
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: pawankalyanfan
          property: host
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@pawankalyanfan.com
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
