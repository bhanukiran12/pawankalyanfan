# Local / production-like stack (matches Render: one API container + web)
# For per-service dev, use: npm run dev:services && npm run dev:gateway && npm run dev:web

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pawankalyanfan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pawankalyanfan
      DIRECT_URL: postgresql://postgres:password@postgres:5432/pawankalyanfan
      AUTH_SERVICE_URL: http://127.0.0.1:4001
      CONTENT_SERVICE_URL: http://127.0.0.1:4002
      COMMUNITY_SERVICE_URL: http://127.0.0.1:4003
      BILLING_SERVICE_URL: http://127.0.0.1:4004
      AI_SERVICE_URL: http://127.0.0.1:4005
      PORT: 4000
    depends_on:
      - postgres

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build --workspace=@pkf/web && npm run start --workspace=@pkf/web"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: /api
      API_GATEWAY_URL: http://api-gateway:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - api-gateway

volumes:
  pgdata:
